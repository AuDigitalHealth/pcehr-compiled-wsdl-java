name: CI

on:
  push:
    branches: [ master, main, 'java-11-jakarta*' ]
  pull_request:
    branches: [ master, main, 'java-11-jakarta*' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Maven verify
        run: mvn -B "-Dgpg.skip=true" clean verify
